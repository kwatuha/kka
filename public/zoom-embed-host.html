<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zoom</title>
  <!--
    On http://&lt;public-ip&gt; (not localhost), browsers omit navigator.mediaDevices.
    Zoom’s bundle evaluates "getDisplayMedia" in navigator.mediaDevices — if mediaDevices is
    undefined, V8 throws: right-hand side of 'in' should be an object, got undefined.
    Stub before any Meeting SDK script. Real camera/mic still needs HTTPS (or localhost).
  -->
  <script>
    (function () {
      try {
        if (typeof navigator !== "undefined" && navigator.mediaDevices == null) {
          navigator.mediaDevices = {};
        }
      } catch (e) {}
    })();
  </script>
  <!-- Served under basePath, e.g. /hmis/zoom-embed-host.html → relative vendor/ resolves to /hmis/vendor/ -->
  <link rel="stylesheet" href="vendor/zoom-meetingsdk.css" />
  <style>
    html, body { margin: 0; height: 100%; width: 100%; background: #111; overflow: hidden; }
    /* Allow vertical scroll so Zoom’s bottom toolbar (mic / camera / join audio) isn’t clipped when
       the in-meeting layout is taller than the iframe. */
    #zroot {
      height: 100%;
      width: 100%;
      min-height: 220px;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
    }
    /*
     * Active Apps / “Apps accessing content” — clinical UX: avoid alarming patients in the video pane.
     * Zoom may still enforce notices in some builds; HMIS also explains this outside the iframe for staff.
     */
    #zroot [class*="active-app"],
    #zroot [class*="ActiveApp"],
    #zroot [class*="active-apps"],
    #zroot button[aria-label*="Active App"],
    #zroot [data-feature="active-apps"] {
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
      position: absolute !important;
      width: 0 !important;
      height: 0 !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
    }
  </style>
</head>
<body>
  <div id="zroot"></div>
  <script src="vendor/zoom-react18.min.js"></script>
  <script src="vendor/zoom-react-dom18.min.js"></script>
  <script src="vendor/zoom-meeting-embedded-ES5.min.js"></script>
  <script>
(function () {
  var activeClient = null;
  var zoomGlobal = null;
  /** Matches `payload.embedGen` from the last `zoom-embed-run` (parent uses it to ignore stale replies). */
  var activeEmbedGen = null;
  /** Keep video canvas height aligned with `#zroot`; reserve caused layout issues with inner scroll + controls. */
  var ZOOM_INTERNAL_TOOLBAR_RESERVE_PX = 0;

  /** Zoom often rejects with `{ type, reason }` (ExecutedFailure), not `Error` — avoid "[object Object]". */
  function formatSdkError(err) {
    if (err == null) return "Unknown error";
    if (typeof err === "string") return err;
    if (typeof err.message === "string" && err.message) return err.message;
    if (typeof err === "object") {
      var o = err;
      if (typeof o.reason === "string") {
        var bits = [];
        if (o.type !== undefined && o.type !== null) bits.push("type:" + String(o.type));
        bits.push(o.reason);
        return bits.join(" ");
      }
      if (typeof o.errorMessage === "string") return o.errorMessage;
      try {
        return JSON.stringify(o);
      } catch (e2) {
        return Object.prototype.toString.call(o);
      }
    }
    return String(err);
  }

  function resolveEmbedded() {
    var z = window.ZoomMtgEmbedded;
    if (z && typeof z.createClient === "function") return z;
    return null;
  }

  var activeAppsObserver = null;

  function installActiveAppsSuppression() {
    try {
      if (activeAppsObserver) {
        activeAppsObserver.disconnect();
        activeAppsObserver = null;
      }
      activeAppsObserver = new MutationObserver(function () {
        try {
          var zroot = document.getElementById("zroot");
          if (!zroot) return;
          var nodes = zroot.querySelectorAll(
            '[role="dialog"], [class*="zm-modal"], [class*="popover"], button, [class*="active-app"]'
          );
          for (var i = 0; i < nodes.length; i++) {
            var el = nodes[i];
            var tx = (el.textContent || "").trim();
            if (tx.length > 400) continue;
            if (/Apps Accessing Content|Active Apps Notifier|active app/i.test(tx)) {
              var hide = el.closest('[role="dialog"]') || el.closest(".zm-modal") || el;
              hide.style.setProperty("display", "none", "important");
            }
          }
        } catch (e0) {}
      });
      activeAppsObserver.observe(document.body, { childList: true, subtree: true });
    } catch (e1) {}
  }

  /**
   * `viewSizes.default` = speaker + gallery; `viewSizes.ribbon` = vertical ribbon (narrow width).
   * Setting both to the full container (previous bug) caused a persistent grey band and video pinned to
   * the bottom once the camera started — see Zoom component-view resizing docs.
   */
  function componentViewSizes(viewW, viewH) {
    var vh = Math.max(220, viewH - ZOOM_INTERNAL_TOOLBAR_RESERVE_PX);
    var ribbonW = Math.max(240, Math.min(316, Math.round(viewW * 0.28)));
    if (ribbonW > viewW - 48) {
      ribbonW = Math.max(240, Math.min(316, viewW - 48));
    }
    return {
      default: { width: viewW, height: vh },
      ribbon: { width: ribbonW, height: vh },
    };
  }

  /** Scroll `#zroot` so Zoom’s bottom toolbar is in view (same as manual scroll). Re-run after layout. */
  function scrollZrootToBottom() {
    try {
      var z = document.getElementById("zroot");
      if (!z) return;
      z.scrollTop = z.scrollHeight;
    } catch (e) {}
  }

  function scheduleScrollZrootToBottomAfterJoin() {
    scrollZrootToBottom();
    window.requestAnimationFrame(function () {
      scrollZrootToBottom();
      window.requestAnimationFrame(function () {
        scrollZrootToBottom();
      });
    });
    [80, 200, 500, 1200].forEach(function (ms) {
      window.setTimeout(scrollZrootToBottom, ms);
    });
  }

  function teardown() {
    try {
      if (activeAppsObserver) {
        activeAppsObserver.disconnect();
        activeAppsObserver = null;
      }
    } catch (e) {}
    try {
      if (activeClient && activeClient.leaveMeeting) activeClient.leaveMeeting();
    } catch (e) {}
    activeClient = null;
    try {
      if (zoomGlobal && zoomGlobal.destroyClient) zoomGlobal.destroyClient();
    } catch (e) {}
    zoomGlobal = null;
    activeEmbedGen = null;
  }

  function runEmbed(payload) {
    var embedGen = payload && payload.embedGen != null ? payload.embedGen : null;
    teardown();
    activeEmbedGen = embedGen;
    zoomGlobal = resolveEmbedded();
    if (!zoomGlobal) {
      window.parent.postMessage(
        {
          type: "zoom-embed-error",
          message: "ZoomMtgEmbedded not available in iframe",
          diagnostics: "iframe-resolve-failed",
          embedGen: embedGen,
        },
        "*"
      );
      return;
    }
    var el = document.getElementById("zroot");
    var viewW = Math.max(320, Math.min(Number(payload.viewW) || 1280, 1920));
    var viewH = Math.max(240, Math.min(Number(payload.viewH) || 720, 1080));
    var vs = componentViewSizes(viewW, viewH);
    /**
     * Zoom 5.x embedded code uses `prop in options.popper` (etc.) on nested customize branches.
     * If `popper` (or another branch) is missing, RHS of `in` is undefined →
     * "right-hand side of 'in' should be an object, got undefined".
     */
    var customize = {
      toolbar: { buttons: [] },
      meetingInfo: [],
      participants: { popper: {} },
      setting: { popper: {} },
      invite: { popper: {} },
      callMe: { popper: {} },
      chat: { notificationCls: {}, popper: {} },
      meeting: { popper: {} },
      activeApps: { popper: {} },
      sharing: { options: {} },
      video: {
        popper: {},
        isResizable: true,
        defaultViewType: "speaker",
        viewSizes: vs,
      },
    };
    var initOpts = {
      zoomAppRoot: el,
      language: "en-US",
      patchJsMedia: false,
      assetPath: "https://source.zoom.us/5.1.4/lib/av",
      customize: customize,
    };
    activeClient = zoomGlobal.createClient();
    var client = activeClient;
    client
      .init(initOpts)
      .then(function () {
        var join = {
          signature: String(payload.signature || "").trim(),
          meetingNumber: String(payload.meetingNumber || "").replace(/\s+/g, ""),
          userName: (payload.userName && String(payload.userName).trim()) || "Guest",
        };
        if (payload.password) join.password = String(payload.password).trim();
        if (payload.userEmail) join.userEmail = String(payload.userEmail).trim();
        var out = client.join(join);
        if (out && typeof out.then === "function") return out;
        return Promise.reject(new Error("join did not return a Promise"));
      })
      .then(function (result) {
        window.parent.postMessage(
          { type: "zoom-embed-joined", resultType: result == null ? "null" : typeof result, embedGen: embedGen },
          "*"
        );
        installActiveAppsSuppression();
        scheduleScrollZrootToBottomAfterJoin();
      })
      .catch(function (err) {
        window.parent.postMessage(
          {
            type: "zoom-embed-error",
            message: formatSdkError(err),
            diagnostics: "iframe-sdk-init-or-join",
            embedGen: embedGen,
          },
          "*"
        );
      });
  }

  function resizeEmbed(payload) {
    if (!activeClient || !activeClient.updateVideoOptions) return;
    var viewW = Math.max(320, Number(payload.viewW) || 1280);
    var viewH = Math.max(240, Number(payload.viewH) || 720);
    var vs = componentViewSizes(viewW, viewH);
    try {
      activeClient.updateVideoOptions({
        isResizable: true,
        defaultViewType: "speaker",
        popper: {},
        viewSizes: vs,
      });
    } catch (e) {}
  }

  window.addEventListener("message", function (ev) {
    if (window.parent === window) return;
    if (ev.source !== window.parent) return;
    var d = ev.data;
    if (!d || !d.type) return;
    if (d.type === "zoom-embed-run") {
      runEmbed(d.payload || {});
    } else if (d.type === "zoom-embed-resize") {
      resizeEmbed(d.payload || {});
    } else if (d.type === "zoom-embed-abort") {
      teardown();
    }
  });

  window.parent.postMessage({ type: "zoom-embed-host-ready" }, "*");
})();
  </script>
</body>
</html>
