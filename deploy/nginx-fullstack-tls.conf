# TLS reverse proxy for docker-compose.shared-mysql.yml (full stack on one host).
# Certs: deploy/ssl/fullchain.pem + privkey.pem (see deploy/setup-api-https-selfsigned.sh YOUR_IP)
#
# Serves:
#   https://YOUR_IP/hmis/   → frontend:3000 (Next static export + basePath /hmis)
#   https://YOUR_IP/api/    → api:3001
#   https://YOUR_IP/uploads/ → api uploads

upstream hmis_frontend_upstream {
    server frontend:3000;
    keepalive 16;
}

upstream hmis_api_upstream {
    server api:3001;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://hmis_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 90s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /uploads/ {
        proxy_pass http://hmis_api_upstream/uploads/;
        proxy_set_header Host $host;
        client_max_body_size 50M;
    }

    location / {
        proxy_pass http://hmis_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
