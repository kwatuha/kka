# System nginx: TLS + reverse proxy for Kakamega County HMIS.
# Domain: kakamega.intellibizafrica.co.ke
# For hmis.azimkim.co.ke as well, prefer deploy/nginx-kakamega-dual-public-host.conf
# Docker: UI host 5400, API host 3222 (docker-compose.kakamega-shared-mysql.yml)
#
# Install (on VPS, needs sudo) — see commands in chat / install-kakamega-nginx-ssl.sh

upstream kakamega_frontend_host {
    server 127.0.0.1:5400;
    keepalive 16;
}

upstream kakamega_api_host {
    server 127.0.0.1:3222;
    keepalive 16;
}

# HTTP — ACME + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name kakamega.intellibizafrica.co.ke;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Kakamega HMIS + API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kakamega.intellibizafrica.co.ke;

    ssl_certificate /etc/letsencrypt/live/kakamega.intellibizafrica.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kakamega.intellibizafrica.co.ke/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location = / {
        return 302 /hmis/;
    }

    location /api/ {
        proxy_pass http://kakamega_api_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 90s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://kakamega_api_host/uploads/;
        proxy_set_header Host $host;
        client_max_body_size 50M;
    }

    location ~ ^/hmis/(.+)\.txt$ {
        error_page 418 = @kakamega_rsc_txt;
        if ($http_rsc = "1") {
            return 418;
        }
        return 302 /hmis/$1$is_args$args;
    }

    location @kakamega_rsc_txt {
        proxy_pass http://kakamega_frontend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header RSC $http_rsc;
        proxy_set_header Next-Router-State-Tree $http_next_router_state_tree;
        proxy_set_header Next-Router-Prefetch $http_next_router_prefetch;
        proxy_set_header Next-Url $http_next_url;
        proxy_set_header Accept $http_accept;
    }

    location / {
        proxy_pass http://kakamega_frontend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
