# Nginx on the VPS when DNS points here (e.g. intellinex.intellibizafrica.co.ke → this server).
# After certbot, replace server_name + ssl paths + ensure proxy lines exist — certbot alone only adds TLS;
# without proxy_pass you still see "Welcome to nginx" and /hmis returns 404.
#
# Install: sudo cp to /etc/nginx/sites-available/intellinex.conf && ln -s to sites-enabled/
# Disable default welcome: sudo rm /etc/nginx/sites-enabled/default   (or merge proxy into default)
#
# Prerequisites: Docker maps host 3102 → HMIS UI, 3001 → API (docker-compose.shared-mysql.yml).

upstream hmis_frontend_host {
    server 127.0.0.1:3102;
    keepalive 16;
}

upstream hmis_api_host {
    server 127.0.0.1:3001;
    keepalive 16;
}

# HTTP → HTTPS (certbot may have added this; avoid duplicate listen 80 blocks)
# server {
#     listen 80;
#     server_name intellinex.intellibizafrica.co.ke;
#     return 301 https://$host$request_uri;
# }

server {
    listen 443 ssl;
    http2 on;
    server_name intellinex.intellibizafrica.co.ke;

    ssl_certificate     /etc/letsencrypt/live/intellinex.intellibizafrica.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intellinex.intellibizafrica.co.ke/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    # Optional: send / to the HMIS app (Next basePath is /hmis)
    location = / {
        return 302 /hmis/;
    }

    location /api/ {
        proxy_pass http://hmis_api_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 90s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://hmis_api_host/uploads/;
        proxy_set_header Host $host;
        client_max_body_size 50M;
    }

    # Prevent browser navigation to Next.js RSC *.txt payloads (show HTML route instead).
    # Soft-nav fetches send RSC: 1 and still receive the .txt file.
    location ~ ^/hmis/(.+)\.txt$ {
        error_page 418 = @hmis_rsc_txt;
        if ($http_rsc = "1") {
            return 418;
        }
        return 302 /hmis/$1$is_args$args;
    }

    location @hmis_rsc_txt {
        proxy_pass http://hmis_frontend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header RSC $http_rsc;
        proxy_set_header Next-Router-State-Tree $http_next_router_state_tree;
        proxy_set_header Next-Router-Prefetch $http_next_router_prefetch;
        proxy_set_header Next-Url $http_next_url;
        proxy_set_header Accept $http_accept;
    }

    # All UI paths (including /hmis/...) go to the static server on 3102
    location / {
        proxy_pass http://hmis_frontend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
