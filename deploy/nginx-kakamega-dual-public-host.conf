# System nginx: TLS + reverse proxy — Kakamega HMIS on TWO public hostnames (same Docker backends).
#
#   https://kakamega.intellibizafrica.co.ke/hmis/   (county / legacy bookmark)
#   https://hmis.azimkim.co.ke/hmis/                 (AZIMKIM / DHA-facing URL)
#
# Docker: UI host 5400, API host 3222 (docker-compose.kakamega-shared-mysql.yml)
#
# TLS (one certificate, both names):
#   sudo certbot certonly --nginx \
#     -d kakamega.intellibizafrica.co.ke -d hmis.azimkim.co.ke
#   Or expand an existing cert: certbot certonly --nginx --expand -d ... -d hmis.azimkim.co.ke
#
# Install:
#   sudo cp deploy/nginx-kakamega-dual-public-host.conf /etc/nginx/sites-available/kakamega-hmis.conf
#   sudo ln -sf /etc/nginx/sites-available/kakamega-hmis.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# If hmis.azimkim.co.ke is on cPanel instead of this VPS, use deploy/cpanel-hmis-azimkim.htaccess.example
# and keep this file for kakamega.intellibizafrica.co.ke only.

upstream kakamega_frontend_host {
    server 127.0.0.1:5400;
    keepalive 16;
}

upstream kakamega_api_host {
    server 127.0.0.1:3222;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name kakamega.intellibizafrica.co.ke hmis.azimkim.co.ke;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kakamega.intellibizafrica.co.ke hmis.azimkim.co.ke;

    # After certbot with both -d names, paths often match the first domain; adjust if certbot uses hmis.azimkim.co.ke:
    ssl_certificate /etc/letsencrypt/live/hmis.azimkim.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hmis.azimkim.co.ke/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # Compress proxied HMIS assets when upstream does not (fallback). Upstream may send gzip too.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    location = / {
        return 302 /hmis/;
    }

    location /api/ {
        proxy_pass http://kakamega_api_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 90s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://kakamega_api_host/uploads/;
        proxy_set_header Host $host;
        client_max_body_size 50M;
    }

    location ~ ^/hmis/(.+)\.txt$ {
        error_page 418 = @kakamega_rsc_txt;
        if ($http_rsc = "1") {
            return 418;
        }
        return 302 /hmis/$1$is_args$args;
    }

    location @kakamega_rsc_txt {
        proxy_pass http://kakamega_frontend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header RSC $http_rsc;
        proxy_set_header Next-Router-State-Tree $http_next_router_state_tree;
        proxy_set_header Next-Router-Prefetch $http_next_router_prefetch;
        proxy_set_header Next-Url $http_next_url;
        proxy_set_header Accept $http_accept;
    }

    location /hmis/_next/static/ {
        proxy_pass http://kakamega_frontend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~ ^/hmis/.*\.html$ {
        proxy_pass http://kakamega_frontend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /hmis {
        return 302 /hmis/;
    }

    location = /hmis/ {
        proxy_pass http://kakamega_frontend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        proxy_pass http://kakamega_frontend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
