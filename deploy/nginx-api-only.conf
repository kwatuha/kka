# TLS reverse proxy for HMIS API (docker-compose.shared-mysql-api-only.yml, service api_https).
# Certs: deploy/ssl/fullchain.pem + privkey.pem from deploy/setup-api-https-selfsigned.sh
upstream hmis_api_upstream {
    server api:3001;
    keepalive 32;
}

server {
    # nginx 1.25+: use "http2 on" — "listen ... http2" can fail with [emerg]
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    location / {
        proxy_pass http://hmis_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 90s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering on;
    }
}
