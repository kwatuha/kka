# Deploy to VPS: /etc/nginx/sites-enabled/default
# Domain: intellinex.intellibizafrica.co.ke
# Docker: HMIS UI on host 3102, API on 3001 (docker-compose.shared-mysql.yml)
#
# After upload:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certbot renew: ensure port 80 can complete HTTP-01 — the /.well-known block below allows
# certbot webroot renewals; if you use `certbot renew` with nginx plugin, it may still work.

upstream hmis_frontend_host {
    server 127.0.0.1:3102;
    keepalive 16;
}

upstream hmis_api_host {
    server 127.0.0.1:3001;
    keepalive 16;
}

# HTTP — ACME + redirect everything else to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name intellinex.intellibizafrica.co.ke;

    # Let's Encrypt HTTP-01 (renewals). Directory must exist: see certbot webroot or nginx plugin.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — HMIS + API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name intellinex.intellibizafrica.co.ke;

    ssl_certificate /etc/letsencrypt/live/intellinex.intellibizafrica.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intellinex.intellibizafrica.co.ke/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location = / {
        return 302 /hmis/;
    }

    location /api/ {
        proxy_pass http://hmis_api_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 90s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://hmis_api_host/uploads/;
        proxy_set_header Host $host;
        client_max_body_size 50M;
    }

    # Next.js static export ships RSC payloads as *.txt. Soft navigation fetches them with
    # header RSC: 1. A known Next bug can fall back to a full browser navigation to *.txt,
    # which shows raw payload text (e.g. /hmis/billing.txt). Redirect those document hits
    # back to the HTML route; keep RSC fetches working.
    location ~ ^/hmis/(.+)\.txt$ {
        error_page 418 = @hmis_rsc_txt;
        if ($http_rsc = "1") {
            return 418;
        }
        return 302 /hmis/$1$is_args$args;
    }

    location @hmis_rsc_txt {
        proxy_pass http://hmis_frontend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header RSC $http_rsc;
        proxy_set_header Next-Router-State-Tree $http_next_router_state_tree;
        proxy_set_header Next-Router-Prefetch $http_next_router_prefetch;
        proxy_set_header Next-Url $http_next_url;
        proxy_set_header Accept $http_accept;
    }

    location / {
        proxy_pass http://hmis_frontend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
